<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SeiyuuRoleProfiler</title>
  <style>
    :root { color-scheme: light; --ink:#121b17; --muted:#5f6f69; --line:#dce5e1; --soft:#eef5f2; --accent:#a83d57; --bg:#fbfcfb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .shell { max-width: 1120px; margin: 0 auto; padding: 32px 22px 64px; }
    .searchHome { min-height: 78vh; display:grid; place-items:center; }
    .searchBox { width:min(720px, 100%); position:relative; }
    h1 { font-size: clamp(40px, 7vw, 84px); letter-spacing:0; margin: 0 0 22px; line-height:.95; }
    input { width:100%; border:1px solid var(--line); border-radius: 8px; padding: 20px 22px; font-size: 28px; font-weight: 750; color:var(--ink); background:white; outline:none; }
    input:focus { border-color:#b7c7c0; box-shadow:0 0 0 4px rgba(64,96,84,.1); }
    .suggestions { position:absolute; left:0; right:0; top: calc(100% + 8px); background:white; border:1px solid var(--line); border-radius:8px; overflow:hidden; z-index:5; box-shadow:0 18px 50px rgba(24,34,30,.12); }
    .suggestion { display:flex; gap:12px; align-items:center; padding:10px 12px; cursor:pointer; border-bottom:1px solid #eef2f0; }
    .suggestion:last-child { border-bottom:0; }
    .suggestion:hover { background:var(--soft); }
    .suggestion img { width:42px; height:42px; border-radius:6px; object-fit:cover; background:var(--soft); }
    .samples { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
    .sample { border:1px solid var(--line); background:white; border-radius:999px; padding:7px 12px; font-size:14px; color:var(--muted); cursor:pointer; }
    .topbar { margin-bottom: 26px; }
    .topbar button { border:1px solid var(--line); background:white; border-radius:8px; padding:10px 14px; cursor:pointer; color:var(--muted); }
    .profileHead { display:grid; grid-template-columns: 140px 1fr; gap:28px; align-items:center; margin: 12px 0 34px; }
    .profileHead img { width:140px; height:140px; border-radius:8px; object-fit:cover; border:1px solid var(--line); background:var(--soft); }
    .profileHead h2 { font-size: clamp(42px, 7vw, 76px); margin:0 0 14px; line-height:.95; letter-spacing:0; }
    .native { color:var(--muted); }
    .chips { display:flex; flex-wrap:wrap; gap:10px; }
    .chip { background:var(--soft); border-radius:999px; padding:9px 14px; color:var(--muted); font-size:20px; }
    .majorLane { border-top:1px solid var(--line); padding-top:30px; }
    .laneHead { display:grid; grid-template-columns: 1fr auto; gap:16px; align-items:end; margin-bottom:10px; }
    .laneHead h3 { font-size: clamp(30px, 4vw, 48px); margin:0; line-height:1; }
    .score { color:var(--accent); font-size:34px; font-weight:850; white-space:nowrap; }
    .meta { color:var(--muted); margin:0 0 22px; font-size:18px; }
    .note { color:var(--muted); margin: 0; padding: 0 18px 14px; font-size:15px; line-height:1.35; }
    details { border:1px solid var(--line); border-radius:8px; background:white; margin:16px 0; overflow:hidden; }
    summary { cursor:pointer; padding:16px 18px; font-size:22px; font-weight:850; color:#174f49; background:var(--soft); }
    .componentList { display:grid; gap:0; }
    .componentRow { display:grid; grid-template-columns:minmax(150px, 1.1fr) 96px 92px minmax(180px, 2fr); gap:12px; align-items:center; padding:11px 18px; border-top:1px solid #edf2ef; }
    .componentName { font-weight:850; overflow-wrap:anywhere; line-height:1.1; }
    .componentEvidence { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:8px; margin-top:2px; }
    .miniChar { display:grid; grid-template-columns:28px minmax(0, 1fr); align-items:center; gap:7px; max-width:220px; padding:5px 7px; border:1px solid #edf2ef; border-radius:8px; background:#fbfdfc; }
    .miniChar img, .miniFallback { width:28px; height:28px; border-radius:6px; object-fit:cover; background:var(--soft); display:grid; place-items:center; color:var(--muted); font-size:13px; font-weight:850; border:1px solid var(--line); }
    .miniName { font-size:13px; font-weight:800; line-height:1.05; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .miniMeta { font-size:11px; color:var(--muted); line-height:1.05; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
    .amp { color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; }
    .pct { color:var(--accent); font-weight:850; font-variant-numeric:tabular-nums; text-align:right; }
    .barTrack { height:12px; background:#f3f6f5; border-radius:999px; overflow:hidden; border:1px solid #e7eeeb; }
    .bar { height:100%; width:calc(var(--pct) * 1%); background:var(--accent); border-radius:999px; }
    .characters { display:grid; grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); gap:16px; margin-top:18px; }
    .char { position:relative; display:block; min-width:0; }
    .char img, .charFallback { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; border:1px solid var(--line); background:var(--soft); display:grid; place-items:center; color:var(--muted); font-size:34px; font-weight:850; }
    .charName { margin-top:7px; font-weight:850; line-height:1.1; overflow-wrap:anywhere; }
    .charMeta { color:var(--muted); font-size:13px; line-height:1.2; margin-top:3px; }
    .charPct { color:var(--accent); font-weight:850; margin-top:4px; }
    .char:after, .suggestion:after { white-space:pre-line; }
    .char:after { content:attr(data-tooltip); position:absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%); background:#15201b; color:white; padding:8px 10px; border-radius:6px; width:max-content; max-width:280px; opacity:0; pointer-events:none; transition:opacity .12s ease; font-size:13px; z-index:10; }
    .char:hover:after { opacity:1; }
    .empty { color:var(--muted); font-size:20px; margin-top:22px; }
    @media (max-width: 640px) {
      .profileHead { grid-template-columns: 92px 1fr; gap:16px; }
      .profileHead img { width:92px; height:92px; }
      input { font-size:22px; }
      .chip { font-size:16px; }
      .score { font-size:26px; }
      .componentRow { grid-template-columns:1fr 76px 70px; }
      .barTrack { grid-column:1 / -1; }
      .miniChar { max-width:100%; }
      .characters { grid-template-columns: repeat(auto-fill, minmax(94px, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="shell" id="app"></main>
  <script>
    const app = document.getElementById('app');
    let data;
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm = value => String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    const pct = value => `${Number(value || 0).toFixed(value && value < 0.01 ? 4 : 2)}%`;
    const amp = value => `${Number(value || 0) >= 0 ? '+' : ''}${Number(value || 0).toFixed(4)}`;
    const intFmt = new Intl.NumberFormat('en-US');
    const dateOnly = value => value ? String(value).slice(0, 10) : '';
    const findProfile = q => {
      const nq = norm(q);
      if (!nq) return null;
      return data.profiles.find(p => p.aliases.includes(nq)) || data.profiles.find(p => p.aliases.some(a => a.includes(nq) || nq.includes(a)));
    };
    async function loadProfile(profileIndex) {
      if (profileIndex.major_lane) return profileIndex;
      const response = await fetch(`${profileIndex.profile_path}?v=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Could not load ${profileIndex.profile_path}`);
      return response.json();
    }
    async function setQuery(name) {
      history.pushState(null, '', `?q=${encodeURIComponent(name)}`);
      await renderProfile(findProfile(name));
    }
    function searchMarkup() {
      return `<section class="searchHome"><div class="searchBox"><h1>SeiyuuRoleProfiler</h1><input id="search" autocomplete="off" placeholder="Seiyuu name" autofocus><div id="suggestions" class="suggestions" hidden></div><div class="samples">${data.samples.slice(0,18).map(s => `<button class="sample" data-name="${esc(s.name)}">${esc(s.name)}</button>`).join('')}</div></div></section>`;
    }
    function wireSearch() {
      const input = document.getElementById('search');
      const suggestions = document.getElementById('suggestions');
      const update = () => {
        const q = norm(input.value);
        const rows = q ? data.profiles.filter(p => p.aliases.some(a => a.includes(q))).slice(0, 8) : [];
        suggestions.hidden = rows.length === 0;
        suggestions.innerHTML = rows.map(p => `<div class="suggestion" data-name="${esc(p.name)}"><img src="${esc(p.image)}" alt=""><strong>${esc(p.name)}</strong><span class="native">${esc(p.native_name)}</span></div>`).join('');
      };
      input.addEventListener('input', update);
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          const profile = findProfile(input.value);
          if (profile) setQuery(profile.name);
        }
      });
      app.addEventListener('click', event => {
        const target = event.target.closest('[data-name]');
        if (target) setQuery(target.dataset.name);
      });
    }
    function renderHome() {
      app.innerHTML = searchMarkup();
      wireSearch();
    }
    function miniCharacterImage(character) {
      if (character.image) return `<img src="${esc(character.image)}" alt="${esc(character.name)}">`;
      return `<div class="miniFallback">${esc((character.name || '?').slice(0, 1))}</div>`;
    }
    function componentEvidence(row) {
      const characters = (row.top_characters || []).filter(character => Number(character.projection || 0) > 0);
      if (!characters.length) return '';
      const meta = character => {
        const match = character.matched_descriptor ? `via ${character.matched_descriptor}` : character.anime || '';
        return character.similarity ? `${match} · sim ${Number(character.similarity).toFixed(2)}` : match;
      };
      return `<div class="componentEvidence">${characters.map(character => `
        <a class="miniChar" href="${esc(character.site_url)}" target="_blank" rel="noreferrer" title="${esc(`${character.name} · ${character.anime || ''} · projection ${Number(character.projection || 0).toFixed(3)}${character.matched_descriptor ? ` · matched ${character.matched_descriptor}` : ''}`)}">
          ${miniCharacterImage(character)}
          <div>
            <div class="miniName">${esc(character.name)}</div>
            <div class="miniMeta">${esc(meta(character))}</div>
          </div>
        </a>`).join('')}</div>`;
    }
    function componentRows(rows, labelKey) {
      const maxPercent = Math.max(...rows.map(row => row.percent), 1);
      return `<div class="componentList">${rows.map(row => {
        const width = Math.max(1, row.percent / maxPercent * 100);
        const details = [];
        if (row.support) details.push(`${row.support} character${row.support === 1 ? '' : 's'}`);
        if (row.member_count && row.member_count > 1) details.push(`${row.member_count} descriptors`);
        if (row.coverage_percent) details.push(`${pct(row.coverage_percent)} cumulative`);
        const support = details.length ? `<div class="charMeta">${esc(details.join(' · '))}</div>` : '';
        return `<div class="componentRow">
          <div><div class="componentName">${esc(row[labelKey])}</div>${support}</div>
          <div class="amp">${amp(row.amplitude)}</div>
          <div class="pct">${pct(row.percent)}</div>
          <div class="barTrack"><div class="bar" style="--pct:${width}"></div></div>
          ${componentEvidence(row)}
        </div>`;
      }).join('')}</div>`;
    }
    function breadthChips(lane) {
      const basis = lane.basis_participation || {};
      const characters = lane.character_participation || {};
      if (!basis.effective_count && !characters.effective_count) return '';
      return `<div class="chips spectrum">
        <span class="chip">basis breadth ${Number(basis.effective_count || 0).toFixed(1)}</span>
        <span class="chip">basis top 10 ${pct(basis.top10_mass_percent)}</span>
        <span class="chip">character breadth ${Number(characters.effective_count || 0).toFixed(1)}</span>
      </div>`;
    }
    function rangeChips(lane) {
      const range = lane.range_metrics || {};
      if (!range.role_range && !range.semantic_spread) return '';
      return `<div class="chips spectrum">
        <span class="chip">role range ${Number(range.role_range || 0).toFixed(2)}</span>
        <span class="chip">semantic spread ${Number(range.semantic_spread || 0).toFixed(2)}</span>
        <span class="chip">range axis ${pct(range.axis_concentration_percent || 0)}</span>
        <span class="chip">lane count ${Number(range.lane_count || 0).toFixed(1)}</span>
      </div>`;
    }
    function characterImage(character) {
      if (character.image) return `<img src="${esc(character.image)}" alt="${esc(character.name)}">`;
      return `<div class="charFallback">${esc((character.name || '?').slice(0, 1))}</div>`;
    }
    function characterGrid(characters) {
      if (!characters || !characters.length) return '<p class="empty">No characters on this side.</p>';
      return `<div class="characters">${characters.map(character => {
        const favourites = Number(character.favourites || 0);
        const tooltip = `${character.name}\n${character.anime || ''}\n${amp(character.amplitude)} amplitude\n${pct(character.percent)} of dominant profile\n${intFmt.format(favourites)} AniList favs`;
        return `<a class="char" href="${esc(character.site_url)}" target="_blank" rel="noreferrer" data-tooltip="${esc(tooltip)}">
          ${characterImage(character)}
          <div class="charName">${esc(character.name)}</div>
          <div class="charMeta">${esc(character.anime || '')}</div>
          <div class="charPct">${amp(character.amplitude)} · ${pct(character.percent)} · ${intFmt.format(favourites)} favs</div>
        </a>`;
      }).join('')}</div>`;
    }
    async function renderProfile(profileIndex) {
      if (!profileIndex) {
        renderHome();
        return;
      }
      app.innerHTML = '<p class="empty">Loading profile...</p>';
      const profile = await loadProfile(profileIndex);
      const lane = profile.major_lane;
      const favMeta = profile.favourite_metadata || data.parameters?.character_favourites || {};
      const favDate = dateOnly(favMeta.cached_at);
      const sharedWeight = lane.shared_role_weight_mode || data.parameters?.shared_role_weight || 'none';
      app.innerHTML = `<div class="topbar"><button id="back">Search</button></div>
        <section class="profileHead">
          <a href="${esc(profile.site_url)}" target="_blank" rel="noreferrer"><img src="${esc(profile.image)}" alt="${esc(profile.name)}"></a>
          <div><h2>${esc(profile.name)} <span class="native">${esc(profile.native_name)}</span></h2><div class="chips"><span class="chip">roles ${profile.role_count}</span><span class="chip">supported chars ${profile.character_count}</span><span class="chip">first year ${profile.first_year || ''}</span></div></div>
        </section>
        <section class="majorLane">
          <div class="laneHead"><h3>${esc(profile.name)} tends to voice characters across this role/personality range</h3></div>
          <p class="meta">Role range measures the longest semantic continuum across this seiyuu's characters. Semantic spread measures total dispersion; range axis shows how much of that spread lies on one main continuum; lane count estimates how many independent directions carry the spread.</p>
          ${rangeChips(lane)}
          ${breadthChips(lane)}
          <details open>
            <summary>One Side Of The Main Contrast</summary>
            <p class="note">Rows are deterministic semantic clusters of original role/personality descriptors on one side of the dominant contrast. Character evidence uses exact or mutual local-99th-percentile semantic matches; clusters are shown until they cover about 95% of displayed descriptor mass.</p>
            ${componentRows(lane.display_descriptor_components || [], 'descriptor')}
          </details>
          <details>
            <summary>Opposite Side Of The Main Contrast</summary>
            <p class="note">This is the other pole of the same dominant contrast. A negative amplitude means a character fits this side, not that the character is weak or unimportant.</p>
            ${componentRows(lane.opposite_display_descriptor_components || [], 'descriptor')}
          </details>
          <h3>Character Contributions</h3>
          <p class="meta">The most representative characters of this distribution, based on their AniList description profiles, are shown below. Favorites are ${esc(favMeta.source || 'AniList')} character favorites${favDate ? ` cached ${esc(favDate)}` : ''} and are shown for context. Shared/recast character edges are weighted by ${esc(sharedWeight)}.</p>
          <details open>
            <summary>One Side Characters</summary>
            ${characterGrid(lane.positive_characters || [])}
          </details>
          <details open>
            <summary>Opposite Side Characters</summary>
            <p class="note">Signed amplitudes are shown as negative because this is the opposite pole of the same contrast.</p>
            ${characterGrid(lane.negative_characters || [])}
          </details>
        </section>`;
      document.getElementById('back').addEventListener('click', () => { history.pushState(null, '', location.pathname); renderHome(); });
    }
    fetch(`profiles.json?v=${Date.now()}`, { cache: 'no-store' }).then(r => r.json()).then(payload => {
      data = payload;
      const params = new URLSearchParams(location.search);
      const q = params.get('q');
      q ? renderProfile(findProfile(q)) : renderHome();
    });
  </script>
</body>
</html>
