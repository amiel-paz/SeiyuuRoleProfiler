<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SeiyuuRoleProfiler</title>
  <style>
    :root { color-scheme: light; --ink:#121b17; --muted:#5f6f69; --line:#dce5e1; --soft:#eef5f2; --accent:#a83d57; --bg:#fbfcfb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .shell { max-width: 1120px; margin: 0 auto; padding: 32px 22px 64px; }
    .searchHome { min-height: 78vh; display:grid; place-items:center; }
    .searchBox { width:min(720px, 100%); position:relative; }
    h1 { font-size: clamp(40px, 7vw, 84px); letter-spacing:0; margin: 0 0 22px; line-height:.95; }
    input { width:100%; border:1px solid var(--line); border-radius: 8px; padding: 20px 22px; font-size: 28px; font-weight: 750; color:var(--ink); background:white; outline:none; }
    input:focus { border-color:#b7c7c0; box-shadow:0 0 0 4px rgba(64,96,84,.1); }
    .suggestions { position:absolute; left:0; right:0; top: calc(100% + 8px); background:white; border:1px solid var(--line); border-radius:8px; overflow:hidden; z-index:5; box-shadow:0 18px 50px rgba(24,34,30,.12); }
    .suggestion { display:flex; gap:12px; align-items:center; padding:10px 12px; cursor:pointer; border-bottom:1px solid #eef2f0; }
    .suggestion:last-child { border-bottom:0; }
    .suggestion:hover { background:var(--soft); }
    .suggestion img { width:42px; height:42px; border-radius:6px; object-fit:cover; background:var(--soft); }
    .samples { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
    .sample { border:1px solid var(--line); background:white; border-radius:999px; padding:7px 12px; font-size:14px; color:var(--muted); cursor:pointer; }
    .topbar { margin-bottom: 26px; }
    .topbar button { border:1px solid var(--line); background:white; border-radius:8px; padding:10px 14px; cursor:pointer; color:var(--muted); }
    .profileHead { display:grid; grid-template-columns: 140px 1fr; gap:28px; align-items:center; margin: 12px 0 34px; }
    .profileHead img { width:140px; height:140px; border-radius:8px; object-fit:cover; border:1px solid var(--line); background:var(--soft); }
    .profileHead h2 { font-size: clamp(42px, 7vw, 76px); margin:0 0 14px; line-height:.95; letter-spacing:0; }
    .native { color:var(--muted); }
    .chips { display:flex; flex-wrap:wrap; gap:10px; }
    .chip { background:var(--soft); border-radius:999px; padding:9px 14px; color:var(--muted); font-size:20px; }
    .majorLane { border-top:1px solid var(--line); padding-top:30px; }
    .laneHead { display:grid; grid-template-columns: 1fr auto; gap:16px; align-items:end; margin-bottom:10px; }
    .laneHead h3 { font-size: clamp(30px, 4vw, 48px); margin:0; line-height:1; }
    .score { color:var(--accent); font-size:34px; font-weight:850; white-space:nowrap; }
    .meta { color:var(--muted); margin:0 0 22px; font-size:18px; }
    .note { color:var(--muted); margin: 0; padding: 0 18px 14px; font-size:15px; line-height:1.35; }
    details { border:1px solid var(--line); border-radius:8px; background:white; margin:16px 0; overflow:hidden; }
    summary { cursor:pointer; padding:16px 18px; font-size:22px; font-weight:850; color:#174f49; background:var(--soft); }
    .componentList { display:grid; gap:0; }
    .componentRow { display:grid; grid-template-columns:minmax(150px, 1.1fr) 96px 92px minmax(180px, 2fr); gap:12px; align-items:center; padding:11px 18px; border-top:1px solid #edf2ef; }
    .componentName { font-weight:850; overflow-wrap:anywhere; line-height:1.1; }
    .componentEvidence { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:8px; margin-top:2px; }
    .miniChar { display:grid; grid-template-columns:28px minmax(0, 1fr); align-items:center; gap:7px; max-width:220px; padding:5px 7px; border:1px solid #edf2ef; border-radius:8px; background:#fbfdfc; }
    .miniChar img, .miniFallback { width:28px; height:28px; border-radius:6px; object-fit:cover; background:var(--soft); display:grid; place-items:center; color:var(--muted); font-size:13px; font-weight:850; border:1px solid var(--line); }
    .miniName { font-size:13px; font-weight:800; line-height:1.05; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .miniMeta { font-size:11px; color:var(--muted); line-height:1.05; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
    .amp { color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; }
    .pct { color:var(--accent); font-weight:850; font-variant-numeric:tabular-nums; text-align:right; }
    .barTrack { height:12px; background:#f3f6f5; border-radius:999px; overflow:hidden; border:1px solid #e7eeeb; }
    .bar { height:100%; width:calc(var(--pct) * 1%); background:var(--accent); border-radius:999px; }
    .characters { display:grid; grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); gap:16px; margin-top:18px; }
    .char { position:relative; display:block; min-width:0; }
    .char img, .charFallback { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; border:1px solid var(--line); background:var(--soft); display:grid; place-items:center; color:var(--muted); font-size:34px; font-weight:850; }
    .charName { margin-top:7px; font-weight:850; line-height:1.1; overflow-wrap:anywhere; }
    .charMeta { color:var(--muted); font-size:13px; line-height:1.2; margin-top:3px; }
    .charPct { color:var(--accent); font-weight:850; margin-top:4px; }
    .char:after, .suggestion:after { white-space:pre-line; }
    .char:after { content:attr(data-tooltip); position:absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%); background:#15201b; color:white; padding:8px 10px; border-radius:6px; width:max-content; max-width:280px; opacity:0; pointer-events:none; transition:opacity .12s ease; font-size:13px; z-index:10; }
    .char:hover:after { opacity:1; }
    .axisCard { border:1px solid var(--line); border-radius:8px; background:white; margin:22px 0; padding:18px; overflow:hidden; }
    .axisPlot { position:relative; height:calc(150px + var(--rows) * 20px); min-height:190px; }
    .axisLine { position:absolute; left:0; right:0; bottom:70px; height:2px; background:#b8c7c1; }
    .originLine { position:absolute; left:calc(var(--origin-x) * 1%); bottom:50px; width:2px; height:calc(90px + var(--rows) * 20px); background:#7f918a; transform:translateX(-50%); }
    .originLabel { position:absolute; left:calc(var(--origin-x) * 1%); bottom:24px; transform:translateX(-50%); color:var(--ink); font-size:16px; font-weight:900; }
    .axisEnd { position:absolute; bottom:42px; color:var(--muted); font-size:15px; font-weight:850; font-variant-numeric:tabular-nums; }
    .axisEnd.min { left:0; }
    .axisEnd.max { right:0; }
    .axisDot { --diameter:38px; position:absolute; left:calc(var(--x) * 1%); bottom:calc(84px + var(--stack) * 20px); width:var(--diameter); height:var(--diameter); border-radius:999px; border:2px solid white; box-shadow:0 0 0 1px var(--line), 0 8px 18px rgba(18,27,23,.12); transform:translateX(-50%); background:var(--soft); overflow:hidden; z-index:2; }
    .axisDot img, .axisDot .dotFallback { width:100%; height:100%; object-fit:cover; display:grid; place-items:center; color:var(--muted); font-size:14px; font-weight:900; }
    .axisDot.negative { filter:saturate(.8); opacity:.86; }
    .axisDot:hover { z-index:8; transform:translateX(-50%) scale(1.16); }
    .descriptorPlane { background:white; margin:22px 0; padding:18px 0 4px; overflow:hidden; }
    .descriptorPlaneVariant + .descriptorPlaneVariant { margin-top:34px; padding-top:28px; border-top:1px solid var(--line); }
    .descriptorPlaneMode { color:var(--deep); font-size:18px; font-weight:900; margin-bottom:8px; }
    .descriptorPlaneHead { margin-bottom:14px; color:var(--muted); font-size:24px; line-height:1.25; }
    .axisXName { color:#174f49; font-weight:950; }
    .axisYName { color:var(--accent); font-weight:950; }
    .descriptor2D { position:relative; height:420px; background:linear-gradient(90deg, rgba(238,245,242,.5) 50%, transparent 50%), linear-gradient(0deg, rgba(238,245,242,.5) 50%, transparent 50%); overflow:hidden; }
    .descriptor2D:before { content:""; position:absolute; left:50%; top:0; bottom:0; width:2px; background:#b8c7c1; transform:translateX(-50%); }
    .descriptor2D:after { content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:#b8c7c1; transform:translateY(-50%); }
    .axisLabel2D { position:absolute; z-index:3; color:var(--muted); font-size:15px; font-weight:900; text-shadow:0 1px 0 white, 0 -1px 0 white, 1px 0 0 white, -1px 0 0 white; }
    .axisLabel2D.xLess { left:0; top:calc(50% + 9px); }
    .axisLabel2D.xMore { right:0; top:calc(50% + 9px); color:var(--accent); }
    .axisLabel2D.yLess { left:calc(50% + 10px); bottom:0; }
    .axisLabel2D.yMore { left:calc(50% + 10px); top:0; color:var(--accent); }
    .descriptorDot { --diameter:44px; position:absolute; left:calc(var(--x) * 1%); top:calc(var(--y) * 1%); width:var(--diameter); height:var(--diameter); border-radius:999px; border:2px solid white; box-shadow:0 0 0 1px var(--line), 0 8px 18px rgba(18,27,23,.14); transform:translate(-50%, -50%); background:var(--soft); overflow:hidden; z-index:2; }
    .descriptorDot img, .descriptorDot .dotFallback { width:100%; height:100%; object-fit:cover; display:grid; place-items:center; color:var(--muted); font-size:14px; font-weight:900; }
    .descriptorDot:hover { z-index:8; transform:translate(-50%, -50%) scale(1.15); }
    .spectrumList { display:flex; flex-wrap:wrap; gap:8px; margin: 8px 0 22px; }
    .spectrumPill { border:1px solid var(--line); border-radius:999px; padding:6px 10px; color:var(--muted); font-size:14px; background:white; }
    .spectrumPill strong { color:var(--ink); }
    .variation { border-top:1px solid var(--line); padding-top:28px; margin-top:34px; }
    .variationCard { border:1px solid var(--line); border-radius:8px; background:white; margin:18px 0; overflow:hidden; }
    .variationHeader { display:grid; grid-template-columns:1fr; gap:12px; align-items:end; padding:16px 18px; background:var(--soft); }
    .variationHeader h4 { margin:0; color:#174f49; font-size:26px; line-height:1.05; }
    .poleGrid { display:grid; grid-template-columns:1fr 1fr; gap:0; border-top:1px solid var(--line); }
    .pole { padding:16px 18px 20px; min-width:0; }
    .pole + .pole { border-left:1px solid var(--line); }
    .pole h5 { margin:0 0 8px; font-size:20px; }
    .fit { color:var(--muted); font-size:15px; margin-bottom:12px; }
    .descriptorLine { font-size:24px; font-weight:900; line-height:1.08; overflow-wrap:anywhere; margin-bottom:10px; }
    .descriptorStep { color:var(--muted); font-size:13px; }
    .descriptorList { display:flex; flex-wrap:wrap; gap:8px; padding:16px 18px; }
    .descriptorToken { border:1px solid var(--line); border-radius:999px; padding:7px 11px; font-weight:850; background:#fbfdfc; }
    .compactChars { display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:12px; margin-top:12px; }
    .compactChars .charName { font-size:15px; }
    .compactChars .charMeta { font-size:12px; }
    .compactChars .charPct { font-size:13px; }
    .empty { color:var(--muted); font-size:20px; margin-top:22px; }
    @media (max-width: 640px) {
      .profileHead { grid-template-columns: 92px 1fr; gap:16px; }
      .profileHead img { width:92px; height:92px; }
      input { font-size:22px; }
      .chip { font-size:16px; }
      .score { font-size:26px; }
      .componentRow { grid-template-columns:1fr 76px 70px; }
      .barTrack { grid-column:1 / -1; }
      .miniChar { max-width:100%; }
      .characters { grid-template-columns: repeat(auto-fill, minmax(94px, 1fr)); }
      .axisDot { --diameter:32px; bottom:calc(84px + var(--stack) * 17px); }
      .axisPlot { height:calc(142px + var(--rows) * 17px); }
      .descriptor2D { height:340px; }
      .descriptorDot { --diameter:34px; }
      .poleGrid { grid-template-columns:1fr; }
      .pole + .pole { border-left:0; border-top:1px solid var(--line); }
    }
  </style>
</head>
<body>
  <main class="shell" id="app"></main>
  <script>
    const app = document.getElementById('app');
    let data;
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm = value => String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    const pct = value => `${Number(value || 0).toFixed(value && value < 0.01 ? 4 : 2)}%`;
    const amp = value => `${Number(value || 0) >= 0 ? '+' : ''}${Number(value || 0).toFixed(4)}`;
    const intFmt = new Intl.NumberFormat('en-US');
    const dateOnly = value => value ? String(value).slice(0, 10) : '';
    const findProfile = q => {
      const nq = norm(q);
      if (!nq) return null;
      return data.profiles.find(p => p.aliases.includes(nq)) || data.profiles.find(p => p.aliases.some(a => a.includes(nq) || nq.includes(a)));
    };
    async function loadProfile(profileIndex) {
      if (profileIndex.major_lane) return profileIndex;
      const response = await fetch(`${profileIndex.profile_path}?v=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Could not load ${profileIndex.profile_path}`);
      return response.json();
    }
    async function setQuery(name) {
      history.pushState(null, '', `?q=${encodeURIComponent(name)}`);
      await renderProfile(findProfile(name));
    }
    function searchMarkup() {
      return `<section class="searchHome"><div class="searchBox"><h1>SeiyuuRoleProfiler</h1><input id="search" autocomplete="off" placeholder="Seiyuu name" autofocus><div id="suggestions" class="suggestions" hidden></div><div class="samples">${data.samples.slice(0,18).map(s => `<button class="sample" data-name="${esc(s.name)}">${esc(s.name)}</button>`).join('')}</div></div></section>`;
    }
    function wireSearch() {
      const input = document.getElementById('search');
      const suggestions = document.getElementById('suggestions');
      const update = () => {
        const q = norm(input.value);
        const rows = q ? data.profiles.filter(p => p.aliases.some(a => a.includes(q))).slice(0, 8) : [];
        suggestions.hidden = rows.length === 0;
        suggestions.innerHTML = rows.map(p => `<div class="suggestion" data-name="${esc(p.name)}"><img src="${esc(p.image)}" alt=""><strong>${esc(p.name)}</strong><span class="native">${esc(p.native_name)}</span></div>`).join('');
      };
      input.addEventListener('input', update);
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          const profile = findProfile(input.value);
          if (profile) setQuery(profile.name);
        }
      });
      app.addEventListener('click', event => {
        const target = event.target.closest('[data-name]');
        if (target) setQuery(target.dataset.name);
      });
    }
    function renderHome() {
      app.innerHTML = searchMarkup();
      wireSearch();
    }
    function miniCharacterImage(character) {
      if (character.image) return `<img src="${esc(character.image)}" alt="${esc(character.name)}">`;
      return `<div class="miniFallback">${esc((character.name || '?').slice(0, 1))}</div>`;
    }
    function componentEvidence(row) {
      const characters = (row.top_characters || []).filter(character => Number(character.projection || 0) > 0);
      if (!characters.length) return '';
      const meta = character => {
        const match = character.matched_descriptor ? `via ${character.matched_descriptor}` : character.anime || '';
        return character.similarity ? `${match} · sim ${Number(character.similarity).toFixed(2)}` : match;
      };
      return `<div class="componentEvidence">${characters.map(character => `
        <a class="miniChar" href="${esc(character.site_url)}" target="_blank" rel="noreferrer" title="${esc(`${character.name} · ${character.anime || ''} · projection ${Number(character.projection || 0).toFixed(3)}${character.matched_descriptor ? ` · matched ${character.matched_descriptor}` : ''}`)}">
          ${miniCharacterImage(character)}
          <div>
            <div class="miniName">${esc(character.name)}</div>
            <div class="miniMeta">${esc(meta(character))}</div>
          </div>
        </a>`).join('')}</div>`;
    }
    function cleanDescriptorLabel(value) {
      const seen = new Set();
      const parts = String(value || '')
        .split('/')
        .map(part => part.trim())
        .filter(part => part && !/^\+\d+$/.test(part))
        .filter(part => {
          const key = part.toLowerCase().replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim();
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      return parts.slice(0, 4).join(' / ');
    }
    function componentRows(rows, labelKey) {
      const maxPercent = Math.max(...rows.map(row => row.percent), 1);
      return `<div class="componentList">${rows.map(row => {
        const width = Math.max(1, row.percent / maxPercent * 100);
        const details = [];
        if (row.support) details.push(`${row.support} character${row.support === 1 ? '' : 's'}`);
        if (row.member_count && row.member_count > 1) details.push(`${row.member_count} descriptors`);
        if (row.coverage_percent) details.push(`${pct(row.coverage_percent)} cumulative`);
        const support = details.length ? `<div class="charMeta">${esc(details.join(' · '))}</div>` : '';
        return `<div class="componentRow">
          <div><div class="componentName">${esc(cleanDescriptorLabel(row[labelKey]))}</div>${support}</div>
          <div class="amp">${amp(row.amplitude)}</div>
          <div class="pct">${pct(row.percent)}</div>
          <div class="barTrack"><div class="bar" style="--pct:${width}"></div></div>
          ${componentEvidence(row)}
        </div>`;
      }).join('')}</div>`;
    }
    function descriptorList(rows) {
      const values = (rows || []).map(row => {
        const label = cleanDescriptorLabel(row.descriptor);
        if (!label) return '';
        const support = Number(row.support || 0);
        return `<span class="descriptorToken" title="${esc(`${label}\\n${support} direct character${support === 1 ? '' : 's'}`)}">${esc(label)}${support ? ` · ${support}` : ''}</span>`;
      }).filter(Boolean);
      if (!values.length) return '<p class="empty" style="padding:0 18px 16px;">No compact descriptor read.</p>';
      return `<div class="descriptorList">${values.slice(0, 10).join('')}</div>`;
    }
    function fitLabel(value) {
      const fit = Number(value || 0);
      if (fit >= 80) return 'strong descriptor read';
      if (fit >= 50) return 'partial descriptor read';
      return 'weak descriptor read';
    }
    function breadthChips(lane) {
      const basis = lane.basis_participation || {};
      const characters = lane.character_participation || {};
      if (!basis.effective_count && !characters.effective_count) return '';
      return `<div class="chips spectrum">
        <span class="chip">basis breadth ${Number(basis.effective_count || 0).toFixed(1)}</span>
        <span class="chip">basis top 10 ${pct(basis.top10_mass_percent)}</span>
        <span class="chip">character breadth ${Number(characters.effective_count || 0).toFixed(1)}</span>
      </div>`;
    }
    function spectrumMarkup(profile) {
      const spectrum = profile.singular_spectrum || [];
      if (!spectrum.length) return '';
      return `<div class="spectrumList">${spectrum.slice(0, 8).map(row => `
        <span class="spectrumPill"><strong>SV${row.rank}</strong> ${Number(row.mass_percent || 0).toFixed(2)}%</span>
      `).join('')}</div>`;
    }
    function rangeChips(lane) {
      const range = lane.range_metrics || {};
      if (!range.role_range && !range.semantic_spread) return '';
      return `<div class="chips spectrum">
        <span class="chip">role range ${Number(range.role_range || 0).toFixed(2)}</span>
        <span class="chip">semantic spread ${Number(range.semantic_spread || 0).toFixed(2)}</span>
        <span class="chip">range axis ${pct(range.axis_concentration_percent || 0)}</span>
        <span class="chip">lane count ${Number(range.lane_count || 0).toFixed(1)}</span>
      </div>`;
    }
    function characterImage(character) {
      if (character.image) return `<img src="${esc(character.image)}" alt="${esc(character.name)}">`;
      return `<div class="charFallback">${esc((character.name || '?').slice(0, 1))}</div>`;
    }
    function favouriteInfo(character) {
      const anilist = Number(character.anilist_favourites ?? character.favourites ?? 0);
      const bangumi = Number(character.bangumi_collects || 0);
      const combined = Number(character.combined_favourites || (anilist + bangumi));
      return {
        anilist,
        bangumi,
        combined,
        label: `${intFmt.format(combined)} combined`,
        tooltip: `${intFmt.format(anilist)} AniList favs` + (bangumi ? `\n${intFmt.format(bangumi)} Bangumi collects` : '')
      };
    }
    function characterGrid(characters) {
      if (!characters || !characters.length) return '<p class="empty">No characters on this side.</p>';
      return `<div class="characters">${characters.map(character => {
        const favourites = favouriteInfo(character);
        const tooltip = `${character.name}\n${character.anime || ''}\n${amp(character.amplitude)} amplitude\n${favourites.tooltip}`;
        return `<a class="char" href="${esc(character.site_url)}" target="_blank" rel="noreferrer" data-tooltip="${esc(tooltip)}">
          ${characterImage(character)}
          <div class="charName">${esc(character.name)}</div>
          <div class="charMeta">${esc(character.anime || '')}</div>
          <div class="charPct">${amp(character.amplitude)} · ${favourites.label}</div>
        </a>`;
      }).join('')}</div>`;
    }
    function compactCharacterGrid(characters) {
      if (!characters || !characters.length) return '<p class="empty">No characters on this side.</p>';
      return `<div class="compactChars">${characters.slice(0, 8).map(character => {
        const favourites = favouriteInfo(character);
        const tooltip = `${character.name}\n${character.anime || ''}\n${amp(character.amplitude)} amplitude\n${favourites.tooltip}`;
        return `<a class="char" href="${esc(character.site_url)}" target="_blank" rel="noreferrer" data-tooltip="${esc(tooltip)}">
          ${characterImage(character)}
          <div class="charName">${esc(character.name)}</div>
          <div class="charMeta">${esc(character.anime || '')}</div>
          <div class="charPct">${amp(character.amplitude)}</div>
        </a>`;
      }).join('')}</div>`;
    }
    function descriptorPhrase(rows) {
      const descriptors = (rows || []).map(row => cleanDescriptorLabel(row.descriptor)).filter(Boolean);
      return descriptors.length ? descriptors.slice(0, 6).join(' / ') : 'weak descriptor read';
    }
    function marginalSteps(rows) {
      const steps = (rows || []).filter(row => row.descriptor);
      if (!steps.length) return '';
      return `<div class="descriptorStep">${steps.slice(0, 4).map(row => esc(row.descriptor)).join(' · ')}</div>`;
    }
    function poleMarkup(pole, label) {
      const descriptors = pole.display_descriptor_components || [];
      return `<section class="pole">
        <h5>${esc(label)}</h5>
        <div class="fit">${fitLabel(pole.descriptor_fit_percent)}</div>
        <div class="descriptorLine">${esc(descriptorPhrase(descriptors))}</div>
        ${marginalSteps(pole.descriptor_steps)}
        ${compactCharacterGrid(pole.characters || [])}
      </section>`;
    }
    function variationAxisPlot(axis) {
      return axisPlot({
        positive_characters: axis.positive_pole?.characters || [],
        negative_characters: axis.negative_pole?.characters || []
      });
    }
    function variationMarkup(axes) {
      if (!axes || !axes.length) return '';
      return `<section class="variation">
        <div class="laneHead"><h3>Role Variations</h3></div>
        ${axes.map(axis => `<article class="variationCard">
          <div class="variationHeader">
            <h4>SV${axis.rank}</h4>
          </div>
          ${variationAxisPlot(axis)}
          <div class="poleGrid">
            ${poleMarkup(axis.positive_pole || {}, 'Positive pole')}
            ${poleMarkup(axis.negative_pole || {}, 'Negative pole')}
          </div>
        </article>`).join('')}
      </section>`;
    }
    function axisDotImage(character) {
      if (character.image) return `<img src="${esc(character.image)}" alt="${esc(character.name)}">`;
      return `<div class="dotFallback">${esc((character.name || '?').slice(0, 1))}</div>`;
    }
    function directDescriptorAxes(lane) {
      const characters = (lane.characters || []).filter(character => Array.isArray(character.descriptors));
      const descriptors = new Set();
      characters.forEach(character => character.descriptors.forEach(descriptor => descriptors.add(descriptor)));
      const rows = [...descriptors].map(descriptor => {
        const support = characters.filter(character => character.descriptors.includes(descriptor)).length;
        const p = support / Math.max(characters.length, 1);
        return { descriptor, support, variance: p * (1 - p) };
      }).filter(row => row.support >= 2 && row.support <= characters.length - 2);
      rows.sort((a, b) => b.variance - a.variance || b.support - a.support || a.descriptor.localeCompare(b.descriptor));
      return rows.slice(0, 2);
    }
    function descriptorAxisDistribution(title, plane) {
      const xAxis = plane.x_axis;
      const xLabel = xAxis.descriptor || xAxis.seed_descriptor || 'descriptor lane';
      const characters = (plane.characters || []).filter(character => Number.isFinite(Number(character.x_score)));
      if (!characters.length) return '';
      const amplitudes = characters.map(character => Number(character.x_score));
      let minScore = Math.min(...amplitudes);
      let maxScore = Math.max(...amplitudes);
      if (Math.abs(maxScore - minScore) < 1.0e-9) {
        minScore -= 0.001;
        maxScore += 0.001;
      }
      const scoreRange = maxScore - minScore;
      const originInRange = minScore <= 0 && maxScore >= 0;
      const originX = originInRange ? ((0 - minScore) / scoreRange * 100) : 50;
      const bins = 17;
      const stacks = Array.from({ length: bins }, () => 0);
      const dots = characters
        .sort((a, b) => Math.abs(Number(b.x_score)) - Math.abs(Number(a.x_score)))
        .map(character => {
          const amplitude = Number(character.x_score);
          const position = (amplitude - minScore) / scoreRange;
          const bin = Math.max(0, Math.min(bins - 1, Math.round(position * (bins - 1))));
          const stack = stacks[bin]++;
          const x = bin / (bins - 1) * 100;
          const favourites = favouriteInfo(character);
          const tooltip = `${character.name}\n${character.anime || ''}\n${amplitude >= 0 ? 'more' : 'less'} ${xLabel}: ${amplitude.toFixed(3)}\n${favourites.tooltip}`;
          return `<a class="axisDot ${amplitude < 0 ? 'negative' : ''}" style="--x:${x}; --stack:${stack}" href="${esc(character.site_url)}" target="_blank" rel="noreferrer" title="${esc(tooltip)}">${axisDotImage(character)}</a>`;
        }).join('');
      const maxRows = Math.max(1, ...stacks);
      const bestRejected = plane.axis_selection?.best_rejected_correlation;
      const rejectionNote = Number.isFinite(Number(bestRejected)) ? ` No disjoint second lane passed corr < 0.5; best was ${Number(bestRejected).toFixed(3)}.` : '';
      return `<div class="descriptorPlaneVariant">
        <div class="descriptorPlaneMode">${esc(title)}</div>
        <div class="descriptorPlaneHead">Single descriptor lane: <span class="axisXName">${esc(xLabel)}</span>.${esc(rejectionNote)}</div>
        <div class="axisPlot" style="--origin-x:${originX}; --rows:${maxRows}">
          <div class="axisLine"></div>
          ${originInRange ? `<div class="originLine"></div><div class="originLabel">origin</div>` : ''}
          <div class="axisEnd min">less ${esc(xLabel)}</div>
          <div class="axisEnd max">more ${esc(xLabel)}</div>
          ${dots}
        </div>
      </div>`;
    }
    function descriptorSpreadPlot(lane) {
      const planeEntries = lane.direct_descriptor_planes
        ? [
            ['Local supported lanes', lane.direct_descriptor_planes.local_supported],
            ['Universal 515-descriptor lanes', lane.direct_descriptor_planes.universal_515]
          ]
        : [['Descriptor lanes', lane.direct_descriptor_plane]];
      const plots = planeEntries.map(([title, plane]) => {
      if (!plane || !plane.x_axis || !plane.characters?.length) return '';
      if (plane.dimension_count === 1 || !plane.y_axis) return descriptorAxisDistribution(title, plane);
      const xAxis = plane.x_axis;
      const yAxis = plane.y_axis;
      const xLabel = xAxis.descriptor || xAxis.seed_descriptor || 'x';
      const yLabel = yAxis.descriptor || yAxis.seed_descriptor || 'y';
      const characters = plane.characters.filter(character => Number.isFinite(Number(character.x_score)) && Number.isFinite(Number(character.y_score)));
      if (!characters.length) return '';
      const maxAbsX = Math.max(...characters.map(character => Math.abs(Number(character.x_score))), 1.0e-9);
      const maxAbsY = Math.max(...characters.map(character => Math.abs(Number(character.y_score))), 1.0e-9);
      const dots = characters.map(character => {
        const xScore = Number(character.x_score);
        const yScore = Number(character.y_score);
        const x = Math.max(4, Math.min(96, 50 + (xScore / maxAbsX) * 44));
        const y = Math.max(4, Math.min(96, 50 - (yScore / maxAbsY) * 44));
        const favourites = favouriteInfo(character);
        const tooltip = `${character.name}\n${character.anime || ''}\n${xScore >= 0 ? 'more' : 'less'} ${xLabel}: ${xScore.toFixed(3)}\n${yScore >= 0 ? 'more' : 'less'} ${yLabel}: ${yScore.toFixed(3)}\n${favourites.tooltip}`;
        return `<a class="descriptorDot" style="--x:${x}; --y:${y}" href="${esc(character.site_url)}" target="_blank" rel="noreferrer" title="${esc(tooltip)}">${axisDotImage(character)}</a>`;
      }).join('');
      return `<div class="descriptorPlaneVariant">
        <div class="descriptorPlaneMode">${esc(title)}</div>
        <div class="descriptorPlaneHead">The two positive descriptor lanes that describe the greatest variation for this seiyuu are <span class="axisXName">${esc(xLabel)}</span> and <span class="axisYName">${esc(yLabel)}</span>.</div>
        <div class="descriptor2D">
          <div class="axisLabel2D xLess">less ${esc(xLabel)}</div>
          <div class="axisLabel2D xMore">more ${esc(xLabel)}</div>
          <div class="axisLabel2D yLess">less ${esc(yLabel)}</div>
          <div class="axisLabel2D yMore">more ${esc(yLabel)}</div>
          ${dots}
        </div>
      </div>`;
      }).filter(Boolean).join('');
      if (!plots) return '';
      return `<section class="descriptorPlane">${plots}</section>`;
    }
    function axisPlot(lane) {
      const byId = new Map();
      [...(lane.negative_characters || []), ...(lane.positive_characters || [])].forEach(character => {
        byId.set(String(character.character_id || character.name), character);
      });
      const characters = [...byId.values()].filter(character => Number.isFinite(Number(character.amplitude)));
      if (!characters.length) return '';
      const amplitudes = characters.map(character => Number(character.amplitude));
      let minScore = Math.min(...amplitudes);
      let maxScore = Math.max(...amplitudes);
      if (Math.abs(maxScore - minScore) < 1.0e-9) {
        minScore -= 0.001;
        maxScore += 0.001;
      }
      const scoreRange = maxScore - minScore;
      const originInRange = minScore <= 0 && maxScore >= 0;
      const originX = originInRange ? ((0 - minScore) / scoreRange * 100) : 50;
      const bins = 17;
      const stacks = Array.from({ length: bins }, () => 0);
      const dots = characters
        .sort((a, b) => Math.abs(Number(b.amplitude)) - Math.abs(Number(a.amplitude)))
        .map(character => {
          const amplitude = Number(character.amplitude);
          const position = (amplitude - minScore) / scoreRange;
          const bin = Math.max(0, Math.min(bins - 1, Math.round(position * (bins - 1))));
          const stack = stacks[bin]++;
          const x = bin / (bins - 1) * 100;
          const favourites = favouriteInfo(character);
          const tooltip = `${character.name}\n${character.anime || ''}\n${amp(amplitude)}\n${favourites.tooltip}`;
          return `<a class="axisDot ${amplitude < 0 ? 'negative' : 'positive'}" style="--x:${x}; --stack:${stack}" href="${esc(character.site_url)}" target="_blank" rel="noreferrer" title="${esc(tooltip)}">${axisDotImage(character)}</a>`;
        })
        .join('');
      const rows = Math.max(...stacks, 1);
      return `<section class="axisCard">
        <div class="axisPlot" style="--rows:${rows}; --origin-x:${originX}">
          ${originInRange ? '<div class="originLine"></div>' : ''}
          <div class="axisLine"></div>
          <div class="axisEnd min">${amp(minScore)}</div>
          <div class="axisEnd max">${amp(maxScore)}</div>
          ${originInRange ? '<div class="originLabel">origin</div>' : ''}
          ${dots}
        </div>
      </section>`;
    }
    async function renderProfile(profileIndex) {
      if (!profileIndex) {
        renderHome();
        return;
      }
      app.innerHTML = '<p class="empty">Loading profile...</p>';
      const profile = await loadProfile(profileIndex);
      const lane = profile.major_lane;
      app.innerHTML = `<div class="topbar"><button id="back">Search</button></div>
        <section class="profileHead">
          <a href="${esc(profile.site_url)}" target="_blank" rel="noreferrer"><img src="${esc(profile.image)}" alt="${esc(profile.name)}"></a>
          <div><h2>${esc(profile.name)} <span class="native">${esc(profile.native_name)}</span></h2><div class="chips"><span class="chip">roles ${profile.role_count}</span><span class="chip">supported chars ${profile.character_count}</span><span class="chip">first year ${profile.first_year || ''}</span></div></div>
        </section>
        <section class="majorLane">
          <div class="laneHead"><h3>Direct Descriptor Spread</h3></div>
          ${descriptorSpreadPlot(lane)}
        </section>
        `;
      document.getElementById('back').addEventListener('click', () => { history.pushState(null, '', location.pathname); renderHome(); });
    }
    fetch(`profiles.json?v=${Date.now()}`, { cache: 'no-store' }).then(r => r.json()).then(payload => {
      data = payload;
      const params = new URLSearchParams(location.search);
      const q = params.get('q');
      q ? renderProfile(findProfile(q)) : renderHome();
    });
  </script>
</body>
</html>
