<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B @ S NMF View</title>
  <style>
    :root { --ink:#111b17; --muted:#60716b; --line:#dce6e2; --soft:#eef6f2; --accent:#ad3f5d; --bg:#fbfcfb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
    a { color:inherit; text-decoration:none; }
    .shell { max-width:1180px; margin:0 auto; padding:34px 24px 72px; }
    .eyebrow { color:var(--muted); font-size:18px; font-weight:800; margin:0 0 8px; }
    h1 { font-size:clamp(42px, 7vw, 82px); line-height:.94; letter-spacing:0; margin:0 0 14px; }
    .dek { color:var(--muted); font-size:22px; line-height:1.35; max-width:880px; margin:0 0 24px; }
    .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:20px 0 26px; }
    label { color:var(--muted); font-weight:800; }
    select, input { border:1px solid var(--line); border-radius:8px; background:white; color:var(--ink); padding:11px 13px; font:inherit; font-weight:750; }
    button { border:1px solid var(--line); border-radius:8px; background:white; color:var(--muted); padding:11px 14px; font:inherit; font-weight:800; cursor:pointer; }
    .statbar { display:flex; flex-wrap:wrap; gap:10px; margin:20px 0 34px; }
    .chip { background:var(--soft); color:var(--muted); border-radius:999px; padding:9px 14px; font-size:17px; }
    .lane { border:1px solid var(--line); border-radius:8px; background:white; overflow:hidden; margin:20px 0; }
    .laneHead { display:grid; grid-template-columns:1fr auto; gap:18px; align-items:end; padding:22px 24px; background:var(--soft); }
    .laneTitle { font-size:clamp(28px, 4vw, 52px); line-height:1.02; font-weight:900; letter-spacing:0; margin:0; }
    .laneScore { color:var(--accent); font-size:34px; font-weight:900; white-space:nowrap; }
    .section { padding:20px 24px; border-top:1px solid #edf2ef; }
    .section h3 { margin:0 0 12px; color:#16564e; font-size:22px; }
    .terms { display:grid; gap:8px; }
    .term { display:grid; grid-template-columns:minmax(150px, 1fr) 90px minmax(130px, 2fr); gap:12px; align-items:center; }
    .termName { font-size:20px; font-weight:900; overflow-wrap:anywhere; }
    .termShare { color:var(--accent); font-weight:900; font-variant-numeric:tabular-nums; text-align:right; }
    .barTrack { height:12px; border:1px solid #e4ece8; background:#f4f7f6; border-radius:999px; overflow:hidden; }
    .bar { height:100%; width:calc(var(--pct) * 1%); background:var(--accent); border-radius:999px; }
    .chars { display:grid; grid-template-columns:repeat(auto-fill, minmax(132px, 1fr)); gap:18px; }
    .char { min-width:0; position:relative; }
    .char img, .fallback { width:100%; aspect-ratio:1; object-fit:cover; display:grid; place-items:center; border:1px solid var(--line); border-radius:8px; background:var(--soft); color:var(--muted); font-size:40px; font-weight:900; }
    .charName { margin-top:8px; font-size:20px; line-height:1.04; font-weight:900; overflow-wrap:anywhere; }
    .anime { margin-top:4px; color:var(--muted); line-height:1.15; }
    .loading { margin-top:5px; color:var(--accent); font-weight:900; font-size:18px; }
    .descriptorList { color:var(--muted); font-size:13px; line-height:1.25; margin-top:5px; }
    .empty { color:var(--muted); font-size:20px; }
    @media (max-width:720px) {
      .term { grid-template-columns:1fr 76px; }
      .barTrack { grid-column:1 / -1; }
      .laneHead { grid-template-columns:1fr; }
      .laneScore { font-size:28px; }
      .chars { grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="shell" id="app"><p class="empty">Loading...</p></main>
  <script>
    const app = document.getElementById('app');
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pct = value => `${(Number(value || 0) * 100).toFixed(1)}%`;
    const number = new Intl.NumberFormat('en-US');
    const pathFor = (name, topk) => `/models/seiyuu_bs_nmf/${name}_bs_nmf_k06_threshold_positive_cosine_t0p75_p3p0_topk${topk}_rownorm.json`;
    const slug = value => String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    const current = () => {
      const params = new URLSearchParams(location.search);
      return { q: params.get('q') || 'Ayana Taketatsu', topk: Number(params.get('topk') || 15) };
    };
    let display = {};
    async function fetchJson(path) {
      const response = await fetch(`${path}?v=${Date.now()}`, { cache:'no-store' });
      if (!response.ok) throw new Error(`Could not load ${path}`);
      return response.json();
    }
    function labelFor(lane) {
      return lane.top_source_descriptors.slice(0, 6).map(row => row.descriptor).join(' / ');
    }
    function termRows(rows) {
      const max = Math.max(...rows.map(row => Number(row.share || 0)), 0.0001);
      return `<div class="terms">${rows.map(row => {
        const width = Math.max(2, Number(row.share || 0) / max * 100);
        return `<div class="term">
          <div class="termName">${esc(row.descriptor)}</div>
          <div class="termShare">${pct(row.share)}</div>
          <div class="barTrack"><div class="bar" style="--pct:${width}"></div></div>
        </div>`;
      }).join('')}</div>`;
    }
    function imageFor(character) {
      const extra = display[String(character.character_id)] || {};
      const image = extra.image || '';
      if (image) return `<img src="${esc(image)}" alt="${esc(character.name)}">`;
      return `<div class="fallback">${esc((character.name || '?').slice(0, 1))}</div>`;
    }
    function characterCard(character) {
      const extra = display[String(character.character_id)] || {};
      const anime = extra.anime_title || character.anime || '';
      const favs = Number(extra.favourites ?? character.favourites ?? 0);
      const descriptors = (character.descriptors || []).slice(0, 8).join(' · ');
      return `<a class="char" href="${esc(character.site_url || extra.site_url || '#')}" target="_blank" rel="noreferrer" title="${esc(`${character.name}\\n${anime}\\n${number.format(favs)} AniList favourites\\n${descriptors}`)}">
        ${imageFor(character)}
        <div class="charName">${esc(character.name)}</div>
        <div class="anime">${esc(anime)}</div>
        <div class="loading">${Number(character.loading || 0).toFixed(3)} loading · ${number.format(favs)} favs</div>
        <div class="descriptorList">${esc(descriptors)}</div>
      </a>`;
    }
    function render(payload, topk) {
      const p = payload.parameters;
      const fit = payload.fit;
      app.innerHTML = `
        <p class="eyebrow">Experimental nonnegative view</p>
        <h1>${esc(p.profile_name)}</h1>
        <p class="dek">Local NMF over <strong>B @ S</strong>: a seiyuu's character-descriptor matrix smoothed into a rich adjectival semantic space. Lanes are additive and nonnegative, so no positive/negative pole weirdness.</p>
        <div class="controls">
          <label for="query">Seiyuu</label>
          <input id="query" value="${esc(p.profile_name)}">
          <label for="topk">semantic neighbors</label>
          <select id="topk">${[15,25,50].map(k => `<option value="${k}" ${k === topk ? 'selected' : ''}>top ${k}</option>`).join('')}</select>
          <button id="go">Load</button>
        </div>
        <div class="statbar">
          <span class="chip">${payload.counts.characters} characters</span>
          <span class="chip">${payload.counts.source_descriptors} source descriptors</span>
          <span class="chip">${payload.counts.target_adjectival_descriptors} adjectival targets</span>
          <span class="chip">density ${(fit.matrix_density * 100).toFixed(1)}%</span>
          <span class="chip">reconstruction error ${fit.relative_reconstruction_error.toFixed(3)}</span>
          <span class="chip">row weighting ${p.row_weight}</span>
        </div>
        ${payload.lanes.map(lane => `
          <section class="lane">
            <div class="laneHead">
              <h2 class="laneTitle">${esc(labelFor(lane))}</h2>
              <div class="laneScore">${pct(lane.strength_share)}</div>
            </div>
            <div class="section">
              <h3>Source descriptors recovered through this lane</h3>
              ${termRows(lane.top_source_descriptors)}
            </div>
            <div class="section">
              <h3>Adjectival semantic targets</h3>
              ${termRows(lane.top_descriptors)}
            </div>
            <div class="section">
              <h3>Representative characters</h3>
              <div class="chars">${lane.top_characters.map(characterCard).join('')}</div>
            </div>
          </section>
        `).join('')}
      `;
      document.getElementById('go').addEventListener('click', () => {
        const q = document.getElementById('query').value;
        const nextTopk = document.getElementById('topk').value;
        history.pushState(null, '', `?q=${encodeURIComponent(q)}&topk=${nextTopk}`);
        load();
      });
    }
    async function load() {
      try {
        const { q, topk } = current();
        const [payload, displayPayload] = await Promise.all([
          fetchJson(pathFor(slug(q), topk)),
          fetchJson('/site/character_display.json'),
        ]);
        display = displayPayload.characters || {};
        render(payload, topk);
      } catch (error) {
        app.innerHTML = `<p class="empty">${esc(error.message)}</p>`;
      }
    }
    load();
  </script>
</body>
</html>
